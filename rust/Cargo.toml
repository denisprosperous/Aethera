[workspace]
resolver = "2"
members = [
    "aethera-guard",
    "aethera-core",
    "aethera-ghost",
    "aethera-geometer",
    "aethera-acif",
    "aethera-alien",
    "aethera-dynamics",
    "aethera-ffi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["AETHERA Project"]

[workspace.dependencies]
rug = "1.27"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
anyhow = "1"
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
