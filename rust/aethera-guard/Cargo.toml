[package]
name = "aethera-guard"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aethera_guard"
path = "src/lib.rs"

[[bin]]
name = "aethera-guard"
path = "src/bin/guard.rs"

[dependencies]
walkdir = "2"
regex = "1"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
