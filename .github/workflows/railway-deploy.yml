name: Railway Backend Deploy

# AETHERA v31.1 — push-to-deploy pipeline for the Railway backend.
#
# This is the repo-side "integration": every push to main (or a manual
# dispatch) ships the backend to the aethera-backend service via the
# official Railway CLI. It requires the repo secret RAILWAY_TOKEN and an
# ACTIVE Railway workspace.
#
# STATUS 2026-09-08 (v31.3-gm): target moved to the NEW active workspace
# project "glistening-miracle" (d9d4ac7c-2aea-4d76-b56a-60d40d447833,
# environment production, service Aethera). The old project
# (2e5a06f9-…) is billing-suspended and dead.
#
# Current wiring state:
#   - Service 'Aethera' is connected to this GitHub repo; pushes to main
#     auto-deploy via Railway's own GitHub integration (verified: commit
#     3a94068 auto-built to deployment 9a04d307 with status SUCCESS).
#   - The secret RAILWAY_TOKEN must hold a token created in the NEW
#     workspace; the old project token is dead ("Not Authorized").
#   - Repo variable RAILWAY_HEALTH_URL (optional) — when set, the job
#     health-gates the deployment for 10 minutes; when unset, the gate
#     is skipped.
#
# NOTE: the Railway GitHub integration deploys BEFORE this workflow runs;
# this job is a redundant belt-and-braces pipeline (explicit `railway up`),
# plus the health gate. Owner runbook: docs/RAILWAY-DEPLOY-RUNBOOK.md

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "Dockerfile"
      - "railway.json"
      - ".github/workflows/railway-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway status \
            --project d9d4ac7c-2aea-4d76-b56a-60d40d447833 \
            --environment production
          railway up \
            --project d9d4ac7c-2aea-4d76-b56a-60d40d447833 \
            --environment production \
            --service Aethera \
            --ci

      - name: Wait for health (gated by repo variable RAILWAY_HEALTH_URL)
        env:
          HEALTH_URL: ${{ vars.RAILWAY_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RAILWAY_HEALTH_URL not set — skipping health gate"; exit 0
          fi
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 10 \
              "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/h.json)"; exit 0
            fi
            echo "attempt $i → HTTP $code; retrying in 15s"; sleep 15
          done
          echo "::warning::backend not healthy 10 min after deploy"
          exit 1
